<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
<title id="title">Where codex-scope runs</title>
<desc id="desc">One Linux host captures. One Mac inspects. All connection details are configured locally.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#3D5D71"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:400}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace}</style>
<rect x="0" y="0" width="1440" height="940" rx="0" fill="#F2EADE"/>
<text x="48" y="68" font-size="36" style="font-weight:600" fill="#604939" text-anchor="start">Where codex-scope runs</text>
<text x="48" y="105" font-size="18" style="font-weight:400" fill="#66574D" text-anchor="start">One Linux host captures. One Mac inspects. All connection details are configured locally.</text>
<rect x="48" y="155" width="832" height="655" rx="16" fill="#EADFCD"/>
<text x="73" y="197" font-size="22" style="font-weight:600" fill="#604939" text-anchor="start">Linux host</text>
<rect x="930" y="155" width="462" height="655" rx="16" fill="#EADFCD"/>
<text x="955" y="197" font-size="22" style="font-weight:600" fill="#604939" text-anchor="start">Mac</text>
<rect x="73" y="255" width="190" height="120" rx="16" fill="#F9F6F0"/>
<text x="93" y="291" font-size="20" style="font-weight:600" fill="#604939" text-anchor="start">Codex</text>
<text x="93" y="325" font-size="17" style="font-weight:400" fill="#66574D" text-anchor="start">Supported hook</text>
<text x="93" y="350" font-size="17" style="font-weight:400" fill="#66574D" text-anchor="start">events</text>
<rect x="343" y="255" width="210" height="120" rx="16" fill="#F9F6F0"/>
<text x="363" y="291" font-size="20" style="font-weight:600" fill="#604939" text-anchor="start">Observer helper</text>
<text x="363" y="325" font-size="17" style="font-weight:400" fill="#66574D" text-anchor="start">One local attempt</text>
<text x="363" y="350" font-size="17" style="font-weight:400" fill="#66574D" text-anchor="start">No decisions</text>
<line x1="263" y1="315" x2="340" y2="315" stroke="#3D5D71" stroke-width="2" marker-end="url(#arrow)"/>
<text x="302" y="291" font-size="16" style="font-weight:400" fill="#3D5D71" text-anchor="middle">input</text>
<line x1="448" y1="375" x2="448" y2="477" stroke="#3D5D71" stroke-width="2" marker-end="url(#arrow)"/>
<text x="465" y="431" font-size="16" style="font-weight:400" fill="#3D5D71" text-anchor="start">local only</text>
<rect x="343" y="480" width="210" height="125" rx="16" fill="#F9F6F0"/>
<text x="363" y="516" font-size="20" style="font-weight:600" fill="#604939" text-anchor="start">Collector</text>
<text x="363" y="551" font-size="17" style="font-weight:400" fill="#66574D" text-anchor="start">Bounded queue</text>
<text x="363" y="576" font-size="17" style="font-weight:400" fill="#66574D" text-anchor="start">No event files</text>
<text x="73" y="481" font-size="19" style="font-weight:400" fill="#604939" text-anchor="start">Codex continues</text>
<text x="73" y="510" font-size="19" style="font-weight:400" fill="#604939" text-anchor="start">without waiting</text>
<text x="73" y="539" font-size="19" style="font-weight:400" fill="#604939" text-anchor="start">for the Mac.</text>
<text x="73" y="662" font-size="18" style="font-weight:400" fill="#66574D" text-anchor="start">No viewer or no capacity?</text>
<text x="73" y="691" font-size="18" style="font-weight:400" fill="#66574D" text-anchor="start">Drop the event.</text>
<text x="73" y="720" font-size="18" style="font-weight:400" fill="#66574D" text-anchor="start">No retries. No offline history.</text>
<rect x="643" y="480" width="214" height="125" rx="16" fill="#F9F6F0"/>
<text x="663" y="516" font-size="20" style="font-weight:600" fill="#604939" text-anchor="start">Tailscale Serve</text>
<text x="663" y="551" font-size="17" style="font-weight:400" fill="#66574D" text-anchor="start">Runs on Linux</text>
<text x="663" y="576" font-size="17" style="font-weight:400" fill="#66574D" text-anchor="start">Private access</text>
<line x1="553" y1="543" x2="640" y2="543" stroke="#3D5D71" stroke-width="2" marker-end="url(#arrow)"/>
<text x="598" y="518" font-size="16" style="font-weight:400" fill="#3D5D71" text-anchor="middle">loopback</text>
<line x1="857" y1="543" x2="952" y2="543" stroke="#3D5D71" stroke-width="2" marker-end="url(#arrow)"/>
<text x="906" y="518" font-size="16" style="font-weight:400" fill="#3D5D71" text-anchor="middle">HTTPS</text>
<text x="643" y="662" font-size="18" style="font-weight:400" fill="#66574D" text-anchor="start">The Mac opens</text>
<text x="643" y="691" font-size="18" style="font-weight:400" fill="#66574D" text-anchor="start">the connection.</text>
<text x="643" y="720" font-size="18" style="font-weight:400" fill="#66574D" text-anchor="start">Tailnet-only HTTPS.</text>
<rect x="955" y="255" width="412" height="120" rx="16" fill="#F9F6F0"/>
<text x="977" y="291" font-size="22" style="font-weight:600" fill="#604939" text-anchor="start">Electron viewer</text>
<text x="977" y="326" font-size="18" style="font-weight:400" fill="#66574D" text-anchor="start">Live stream, filters, frozen history</text>
<text x="977" y="353" font-size="18" style="font-weight:400" fill="#66574D" text-anchor="start">Local UI; payloads displayed as text</text>
<rect x="955" y="480" width="412" height="125" rx="16" fill="#F9F6F0"/>
<text x="977" y="516" font-size="22" style="font-weight:600" fill="#604939" text-anchor="start">Connection and recording</text>
<text x="977" y="551" font-size="18" style="font-weight:400" fill="#66574D" text-anchor="start">Credentials stay outside the UI</text>
<text x="977" y="578" font-size="18" style="font-weight:400" fill="#66574D" text-anchor="start">Bounded background work</text>
<line x1="1160" y1="480" x2="1160" y2="378" stroke="#3D5D71" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1180" y="430" font-size="16" style="font-weight:400" fill="#3D5D71" text-anchor="start">event summaries</text>
<line x1="1160" y1="605" x2="1160" y2="687" stroke="#3D5D71" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1180" y="653" font-size="16" style="font-weight:400" fill="#3D5D71" text-anchor="start">append / query</text>
<rect x="955" y="690" width="412" height="90" rx="16" fill="#E0D2BD"/>
<text x="977" y="725" font-size="22" style="font-weight:600" fill="#604939" text-anchor="start">Temporary SQLite</text>
<text x="977" y="756" font-size="17" style="font-weight:400" fill="#604939" text-anchor="start">Size limit · deleted on normal close</text>
<text x="48" y="865" font-size="24" style="font-weight:600" fill="#604939" text-anchor="start">Drop data before consuming unbounded CPU, memory, or disk.</text>
<text x="48" y="903" font-size="16" style="font-weight:400" fill="#66574D" text-anchor="start">Proposed architecture · Generic deployment · No offline recording in any release</text>
</svg>
