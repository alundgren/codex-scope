'Review instructions':'Review the pinned PR revision with the user. Separate observed facts from hypotheses. Use the local GitHub CLI for GitHub access. Keep one conversation across all lenses. Do not post feedback until the user explicitly chooses to send the preview.',

case'evidence-missing':state.evidenceMissing=true;state.view='Visual evidence';$('#modal').remove();render();break;
case'stale':state.stale=true;$('#modal').remove();render();break;
case'refresh-pr':state.stale=false;state.revision='c41f730';state.findings=[false,false];state.highlight=false;state.arrow=false;render();notify('New revision loaded. Previous marks cleared; findings need rechecking.');break;
case'disconnect':state.failed=true;$('#modal').remove();render();break;
case'reconnect':state.failed=false;render();notify('Reconnected in this simulated state.');break;
case'model-error':modal(`<h1>Models unavailable</h1><p>The installed Codex CLI could not return its catalog. No fallback model has been selected.</p>${btn('Retry catalog lookup','retry-models','primary')}`,true);break;
case'retry-models':modelPicker(state.settings==='analysis'?'diagnosis':'review');break;
}
if(op==='menu-nav'){state.page=value;$('#modal').remove();render()}
});
let draggedCard=null;document.addEventListener('dragstart',e=>{draggedCard=e.target.closest('.board-card')});document.addEventListener('dragover',e=>{if(e.target.closest('.board-card'))e.preventDefault()});document.addEventListener('drop',e=>{const target=e.target.closest('.board-card');if(target&&draggedCard&&target!==draggedCard){e.preventDefault();target.before(draggedCard);draggedCard=null}});
document.addEventListener('change',e=>{if(e.target.dataset.effort){if(e.target.dataset.effort==='review')state.effort=e.target.value;else state.diagnosisEffort=e.target.value}if(e.target.dataset.finding!==undefined){state.findings[+e.target.dataset.finding]=e.target.checked;render()}});
document.addEventListener('input',e=>{const selectors={'home-search':['.function','#no-functions'],'menu-search':['.menu-result','#no-menu'],'model-search':['[data-model]','#no-models']};const entry=selectors[e.target.id];if(!entry)return;let n=0;document.querySelectorAll(entry[0]).forEach(el=>{const match=el.dataset.search.includes(e.target.value.toLowerCase());el.hidden=!match;if(match)n++});$(entry[1]).hidden=n>0});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal')?.remove();if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();document.querySelector('[data-action="menu"]').click()}if(e.key==='Tab'&&$('#modal')){const all=[...$('#modal').querySelectorAll('button,input,textarea,select')].filter(x=>!x.disabled&&!x.hidden);if(e.shiftKey&&document.activeElement===all[0]){e.preventDefault();all.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===all.at(-1)){e.preventDefault();all[0].focus()}}});
render();
</script></html>
