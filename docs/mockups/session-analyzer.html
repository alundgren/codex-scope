ype .synthetic{margin-left:auto;color:var(--accent)}main{max-width:1540px;margin:auto;padding:30px 36px 34px}.sessionline{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}h1{font-size:32px;line-height:1.2;letter-spacing:-.015em;font-weight:600;margin:18px 0 10px}.intro{margin:0 0 22px;max-width:80ch}.status{padding:11px 14px;background:var(--surface);border-left:3px solid var(--line);margin-bottom:24px;font-size:13.5px}.status.warn{border-color:var(--accent)}.metrics{display:flex;gap:44px;align-items:baseline;flex-wrap:wrap;margin:22px 0 26px}.metric{display:flex;gap:12px;align-items:baseline}.metric strong{font-size:32px;line-height:1.2;letter-spacing:-.015em}.metric span{max-width:150px;font-size:13.5px}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:32px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 14px}.toolbar input[type=search]{flex:1;min-width:160px}.toolbar label{font-size:13.5px}.toolbar select{font-size:13.5px}.list{display:grid;gap:2px}.call{display:grid;grid-template-columns:38px minmax(0,1fr) 95px;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-radius:6px;padding:15px 13px;background:transparent;position:relative}.call:nth-child(odd){background:var(--surface)}.call[aria-pressed=true]{background:var(--raised);box-shadow:inset 3px 0 var(--accent)}.call .num{color:var(--muted);font-size:13.5px}.call .value{text-align:right}.call .value small{display:block}.call code{display:block;font-size:14px}.call .bar{height:4px;background:var(--line);margin-top:8px;width:100%;border-radius:4px}.call .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}.call small{display:block;margin-top:4px}.inspector{padding:22px 24px;background:var(--surface);border-radius:10px;align-self:start;min-width:0}.inspectline{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13.5px}.inspector p{margin:14px 0}.inspector .count{font-size:32px;font-weight:600;line-height:1.2;margin-top:22px}.inspector .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.evidence{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}.excerpt{font-size:13.5px}.empty{padding:62px 22px;text-align:center;background:var(--surface);border-radius:8px}.empty p{margin:0 auto 16px}.foot{font-size:13.5px;color:var(--muted);margin:24px 0 0;max-width:100ch}.trail-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,1fr);gap:45px}.trail{position:relative;padding-left:22px}.trail:before{content:"";position:absolute;left:30px;top:22px;bottom:22px;width:1px;background:var(--line)}.step{position:relative;margin-bottom:9px;display:grid;grid-template-columns:50px minmax(0,1fr) 88px;gap:12px;text-align:left;width:100%;background:var(--bg);border:0;padding:12px 10px 12px 0}.step .dot{width:18px;height:18px;border-radius:50%;background:var(--bg);border:2px solid var(--line);margin-left:0;margin-top:4px;z-index:1}.step[aria-pressed=true]{background:var(--surface)}.step[aria-pressed=true] .dot{background:var(--accent);border-color:var(--accent)}.step small{display:block;margin-top:3px}.step .value{text-align:right}.step code{display:block}.trail-marker{padding:8px 0 16px 62px;font-size:13.5px;color:var(--muted)}.route{display:grid;grid-template-columns:1fr 100px 1fr;gap:20px;align-items:center;margin:32px 0}.routebox{background:var(--surface);border:1px solid transparent;padding:24px;border-radius:10px;text-align:left;min-height:230px}.routebox[aria-pressed=true]{border-color:var(--accent)}.routebox .amount{display:block;font-size:36px;font-weight:600;margin:12px 0}.routebox small{display:block}.routebox .routebar{height:8px;border-radius:4px;background:var(--line);margin:15px 0}.routebox .routebar i{display:block;height:100%;background:var(--accent);border-radius:4px}.routebox.scout .routebar i{background:var(--blue)}.connector{font-size:13.5px;text-align:center;color:var(--blue)}.connector .arrow{font-size:30px;display:block}.routing-bottom{display:grid;grid-template-columns:1.25fr 1fr;gap:40px}.compact-row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}.calculator{background:var(--surface);padding:24px;border-radius:10px}.calculator label{display:block}.calculator input{width:100%;margin:20px 0 10px}.calc-value{font-size:32px;font-weight:600}.review-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:40px}.review-queue{display:grid;gap:10px;align-content:start}.proposal{padding:16px;text-align:left;border:1px solid transparent;background:var(--surface)}.proposal[aria-pressed=true]{border-color:var(--accent);background:var(--raised)}.proposal small{display:block;margin-top:6px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:24px}.comparison pre{min-height:116px}.review-sheet{min-width:0}.review-sheet .statement{font-size:16px;line-height:1.55;margin:6px 0 16px}.review-sheet .actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.review-summary{border-top:1px solid var(--line);padding-top:20px;margin-top:24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}.guidance{max-width:960px}.guidance p{max-width:80ch}.guidance details{border-bottom:1px solid var(--line);padding:17px 0}.guidance summary{cursor:pointer}.guidance table{width:100%;border-collapse:collapse;margin:18px 0;font-size:13.5px}.guidance th,.guidance td{text-align:left;padding:12px;vertical-align:top;border-bottom:1px solid var(--line)}.guidance th{font-weight:500}.notice{color:var(--accent)}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--field);padding:10px 20px;border-radius:8px;max-width:90vw;z-index:3}#toast:empty{display:none}@media(max-width:1000px){.layout,.trail-layout{grid-template-columns:1.2fr 1fr;gap:20px}.call{grid-template-columns:24px minmax(0,1fr) 76px;padding:12px 9px}.review-layout{grid-template-columns:220px minmax(0,1fr);gap:24px}.metrics{gap:24px}.route{grid-template-columns:1fr 70px 1fr;gap:10px}}@media(max-width:760px){header{padding:18px 18px 0}.brandline{align-items:start}.brand small{display:block;margin:4px 0}.nav{gap:0}.nav button{padding:11px 10px;font-size:13.5px}.nav span{margin-right:5px}.prototype{padding:12px 18px;gap:10px}.prototype .synthetic{margin-left:0;width:100%}main{padding:23px 18px}h1{font-size:28px}.layout,.trail-layout,.routing-bottom,.review-layout,.comparison{grid-template-columns:1fr}.route{grid-template-columns:1fr}.connector .arrow{transform:rotate(90deg)}.routebox{min-height:0}.review-queue{grid-template-columns:1fr}.metric strong{font-size:28px}.sessionline{gap:5px}.inspector{padding:20px}.step{grid-template-columns:32px minmax(0,1fr) 76px}.trail-marker{padding-left:44px}.guidance table{display:block;overflow:auto}.brandline>button{font-size:13.5px}.comparison pre{min-height:0}}

<header><div class="brandline"><div class="brand">Codex Scope <small>Session analyzer · four concepts</small></div><button id="guide">Build guidance ↗</button></div><nav class="nav" aria-label="Analyzer concepts" role="tablist"><button role="tab" data-view="ledger"><span>01</span>Result ledger</button><button role="tab" data-view="trail"><span>02</span>Search trail</button><button role="tab" data-view="routing"><span>03</span>Agent routing</button><button role="tab" data-view="review"><span>04</span>Workflow review</button></nav></header>
<div class="prototype"><label>Capture detail <select id="capture"><option value="proposed">Proposed delivery metadata</option><option value="hooks">Hook evidence</option></select></label><label>Scenario <select id="scenario"><option value="sample">Retained sample</option><option value="gap">Coverage gap</option><option value="missing">Missing responses</option><option value="empty">Empty session</option><option value="evicted">Selected call evicted</option></select></label><span class="synthetic">Interactive concept · all data is synthetic</span></div>
<main id="main"></main><div id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const calls=[
{id:1,time:'14:32:04',cmd:'rg -n "timeout" .',label:'Search the whole repository',tokens:11800,kib:44.8,model:'Main model',actor:'Main agent',flag:'Repository-wide search',why:'The command searches from the repository root. A narrower path may remove unrelated results.',detail:'The synthetic return includes matches in fixtures, documentation and generated clients. This is a review candidate; broad discovery can be necessary.',next:'rg --files src/inventory\nrg -n "timeout" src/inventory',scope:'Repository root · no path prefilter',excerpt:'docs/operations.md:42: request timeout\nfixtures/errors.json:8: timeout\nsrc/inventory/client.ts:128: timeoutMs: 5000\ngenerated/api-client.ts:816: timeout',trail:'A known task area was available before this call.'},
{id:2,time:'14:32:19',cmd:'cat src/inventory/*.ts',label:'Read every inventory file',tokens:6700,kib:25.5,model:'Main model',actor:'Main agent',flag:'Full-file batch read',why:'The command reads every matching TypeScript file without selecting a symbol or line range.',detail:'The example includes eleven files. A symbol search could identify the retry function before reading complete files. Dependencies may still require wider reading.',next:'rg -n "fetchInventory|retry" src/inventory\nsed -n \'110,165p\' src/inventory/client.ts',scope:'Inventory directory · full file contents',excerpt:'// client.ts\nexport async function fetchInventory(sku: string) {\n  return transport.get(`/inventory/${sku}`);\n}\n// ten more files follow in the synthetic return',trail:'The preceding search already exposed src/inventory/client.ts.'},
{id:3,time:'14:33:02',cmd:'rg -n "timeout" .',label:'Repeat the repository search',tokens:3400,kib:13.0,model:'Main model',actor:'Main agent',flag:'Repeated command',why:'The same command appeared earlier in retained history. Check whether intervening edits justify another search.',detail:'The synthetic result is shorter than the first. Matching arguments alone do not prove the output was identical or unnecessary.',next:'rg -n "timeout" src/inventory/client.ts',scope:'Repository root · repeated arguments',excerpt:'src/inventory/client.ts:128: timeoutMs: 5000\nsrc/inventory/retry.ts:21: isTimeout(error)\ndocs/operations.md:42: request timeout',trail:'The command repeats call 01. Output equality and file changes are unknown.'},
{id:4,time:'14:33:18',cmd:'rg --files src/inventory',label:'List candidate files',tokens:300,kib:1.1,model:'Main model',actor:'Main agent',flag:'',why:'This call returns filenames within a named directory.',detail:'A small return is consistent with narrowing the next read. It does not prove that the complete workflow is efficient.',next:'rg -n "fetchInventory" src/inventory/client.ts',scope:'Inventory directory · filenames only',excerpt:'src/inventory/client.ts\nsrc/inventory/retry.ts\nsrc/inventory/client.test.ts',trail:'Filename filtering starts after the three largest main-agent returns.'},
{id:5,time:'14:33:36',cmd:'rg -n "fetchInventory" src/inventory',label:'Scout locates the function',tokens:3200,kib:12.2,model:'Budget model',actor:'Scout',flag:'',why:'The search names the function and the inventory directory.',detail:'The model value is supplied by the synthetic hook. The Scout attribution requires proposed actor metadata.',next:'sed -n \'110,165p\' src/inventory/client.ts',scope:'Inventory directory · named symbol',excerpt:'src/inventory/client.ts:122: export async function fetchInventory\nsrc/inventory/client.test.ts:31: describe("fetchInventory", () => {',trail:'Proposed actor metadata attributes this call to the scout.'},
{id:6,time:'14:33:48',cmd:"sed -n '110,165p' src/inventory/client.ts",label:'Scout reads the relevant range',tokens:1200,kib:4.6,model:'Budget model',actor:'Scout',flag:'',why:'The command selects a bounded range from one file.',detail:'The displayed range is a synthetic example. It must include enough surrounding code to support a correct change.',next:'Return file, line range, retry behavior and unresolved questions.',scope:'One file · lines 110 to 165',excerpt:'export async function fetchInventory(sku: string) {\n  return transport.get(`/inventory/${sku}`, { timeoutMs: 5000 });\n}',trail:'A named symbol from the preceding call leads to a bounded read.'},
{id:7,time:'14:34:09',cmd:'wait_agent → scout report',label:'Main agent receives a digest',tokens:420,kib:1.6,model:'Main model',actor:'Main agent',flag:'',why:'The proposed delivery metadata links one scout report to its receiving main agent.',detail:'A subagent stop message alone does not prove the parent received the same text. Hook mode leaves that delivery relationship unknown.',next:'Inspect the cited function before applying the change.',scope:'Proposed report delivery · explicit parent link',excerpt:'Retry belongs in src/inventory/client.ts:122–145.\nThe transport currently makes one attempt.\nRetry timeouts only; preserve other errors.\nCheck client.test.ts for the existing failure cases.',trail:'The scout read 4,400 tokens and returned a 420-token digest in this example.'},
{id:8,time:'14:34:42',cmd:'npm test -- inventory',label:'Check the retry behavior',tokens:280,kib:1.1,model:'Main model',actor:'Main agent',flag:'',why:'The command selects the inventory tests.',detail:'A short passing test return supports this experiment only within the selected tests. It does not establish overall task quality.',next:'Review the timeout and non-timeout assertions.',scope:'Inventory tests · focused test run',excerpt:'PASS src/inventory/client.test.ts\nTests: 8 passed, 8 total',trail:'The synthetic session ends with a focused test run.'}
];
const state={view:'ledger',selected:1,query:'',candidates:false,sort:'size',proposal:0,decisions:['unreviewed','unreviewed','unreviewed'],route:'main'};let toastTimer;
const rich=()=>$('#capture').value==='proposed';const scenario=()=>$('#scenario').value;const available=()=>scenario()==='empty'?[]:scenario()==='evicted'?calls.filter(c=>c.id!==1):calls;const hasResponse=()=>scenario()!=='missing';const fmt=n=>n.toLocaleString('en-US');const value=c=>!hasResponse()?'Unknown':rich()?fmt(c.tokens):c.kib.toFixed(1);const unit=()=>rich()?'demo tokens':'KiB observed';
function tell(t){$('#toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',4500)}
function download(name,text){const a=document.createElement('a');const u=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function status(){let msg=rich()?'Proposed capture · delivered-token values and agent links are invented for this concept. No billing data.':'Hook evidence · response bytes and supplied model only. Delivery to context and agent attribution remain unverified.';if(scenario()==='gap')msg+=' Coverage gap 14:32:30–14:32:55. Session loss unknown. Collector reports 2 global oversized drops.';if(scenario()==='missing')msg+=' Tool responses unavailable. Counts and rankings by output size cannot be calculated.';if(scenario()==='evicted')msg+=' Call 01 was evicted. Totals cover the seven remaining calls. The removed evidence is unavailable.';return `<div class="status ${scenario()!=='sample'?'warn':''}">${msg}</div>`}
function shell(title,intro){return `<div class="sessionline"><span>demo-a7 · Fix inventory timeout retries</span><span>Retained interval 14:32–14:35 UTC · coverage outside capture unknown</span></div><h1>${title}</h1><p class="intro">${intro}</p>${status()}`}
function empty(){return '<div class="empty"><p>No retained tool calls for this session.</p><p class="muted">A connection does not establish hook coverage. Capture may have started after the session.</p><button data-reset>Restore sample</button></div>'}
function metrics(){const list=available();const n=list.reduce((a,c)=>a+(rich()?c.tokens:c.kib),0);return `<div class="metrics"><div class="metric"><strong>${hasResponse()?(rich()?fmt(n):n.toFixed(1)):'Unknown'}</strong><span>${rich()?'demo delivered tokens':'KiB of observed responses'}<br>retained sample only</span></div><div class="metric"><strong>${list.length}</strong><span>retained tool records<br>${!hasResponse()?'responses unavailable':rich()?'including scout report':'in this sample'}</span></div><div class="metric"><strong>${list.filter(c=>c.flag).length}</strong><span>candidates to review<br>waste is unproven</span></div></div>`}
function inspect(c){return `<aside class="inspector" aria-label="Selected call"><div class="inspectline"><span>Call ${String(c.id).padStart(2,'0')} · ${c.time}</span><span>${esc(rich()?c.actor:c.model)}</span></div><div class="count">${value(c)}</div><small>${unit()} · ${hasResponse()?'synthetic fixture value':'response unavailable'}</small><pre>${esc(c.cmd)}</pre><p>${esc(c.why)}</p><small>${esc(hasResponse()?c.detail:'Only the command is available. Inspect its scope, but do not infer response contents or size.')}</small><div class="evidence"><small>${esc(c.scope)}</small><pre class="excerpt">${hasResponse()?esc(c.excerpt):'Response was not captured. Its size and contents are unknown.'}</pre><small>Authored excerpt, not the complete response or original hook JSON.</small></div><div class="actions"><button data-trace="${c.id}">Trace this call</button><button data-proposal="${Math.min(c.id-1,2)}">Review a change</button></div></aside>`}
function ledger(){let list=available().filter(c=>(!state.candidates||c.flag)&&c.cmd.toLowerCase().includes(state.query.toLowerCase()));if(state.sort==='size'&&hasResponse())list.sort((a,b)=>b.tokens-a.tokens);if(list.length&&!list.some(c=>c.id===state.selected))state.selected=list[0].id;const c=list.find(c=>c.id===state.selected);return shell('Find the returns worth questioning','Start with the largest results. Inspect the command before deciding whether a narrower search would have answered the task.')+(available().length?metrics()+`<div class="layout"><section aria-label="Retained tool calls"><div class="toolbar"><input id="search" type="search" aria-label="Search commands" placeholder="Search commands…" value="${esc(state.query)}"><select id="sort" aria-label="Sort calls"><option value="size" ${state.sort==='size'?'selected':''}>Largest return first</option><option value="time" ${state.sort==='time'?'selected':''}>Observation order</option></select><label><input id="candidates" type="checkbox" ${state.candidates?'checked':''}> Candidates only</label></div><div class="list">${list.map(c=>`<button class="call" data-call="${c.id}" aria-pressed="${state.selected===c.id}"><span class="num">${String(c.id).padStart(2,'0')}</span><span><code>${esc(c.cmd)}</code><small>${esc(c.model)} · ${esc(c.flag||'No rule triggered')}</small>${hasResponse()?`<div class="bar"><i style="width:${c.tokens/11800*100}%"></i></div>`:''}</span><span class="value">${value(c)}<small>${rich()?'tokens':'KiB'}</small></span></button>`).join('')||'<div class="empty"><p>No matching commands.</p><button id="reset-search">Reset filters</button></div>'}</div></section>${c?inspect(c):'<aside class="inspector">No call selected.</aside>'}</div><p class="foot">Return size is a triage signal. Hook payload size includes metadata and arguments and must never be labeled context size.</p>`:empty())}
function trail(){const list=available();const c=list.find(c=>c.id===state.selected)||list[0];return shell('Follow the search, one decision at a time','See when the scope narrows, when a command repeats, and what was already available before the next read.')+(list.length?`<div class="trail-layout"><section class="trail" aria-label="Call observation sequence"><div class="trail-marker">Task asks about inventory timeouts</div>${list.map(c=>`${c.id===5?'<div class="trail-marker">'+(rich()?'Scout starts · proposed actor link':'Budget model first observed · actor unknown')+'</div>':''}<button class="step" data-call="${c.id}" aria-pressed="${state.selected===c.id}"><span class="dot"></span><span>${esc(!rich()&&c.id===5?'Budget model locates the function':!rich()&&c.id===6?'Budget model reads the range':!rich()&&c.id===7?'A report is observed':c.label)}<small>${c.time} · ${esc(c.model)}</small><code>${esc(c.cmd)}</code></span><span class="value">${value(c)}<small>${rich()?'tokens':'KiB'}</small></span></button>`).join('')}<div class="trail-marker">End of retained sample · no replay</div></section><aside class="inspector"><div class="inspectline"><span>Call ${String(c.id).padStart(2,'0')}</span><span>${esc(c.scope.split(' · ')[0])}</span></div><pre>${esc(c.cmd)}</pre><p>${esc(c.trail)}</p><div class="evidence"><p>${esc(c.why)}</p><pre>${esc(c.next)}</pre><small>Proposal for a future attempt. Commands are not executed.</small></div><div class="actions"><button data-ledger="${c.id}">Inspect return</button><button data-proposal="${Math.min(c.id-1,2)}">Review a change</button></div><p class="muted">Sequence shows observation order. Suggested relationships require review and do not reveal the agent's reasoning.</p></aside></div>`:empty())}
function routing(){const list=available();let main=list.filter(c=>c.model==='Main model'),scout=list.filter(c=>c.model==='Budget model');const total=cs=>!hasResponse()?'Unknown':rich()?fmt(cs.reduce((a,c)=>a+c.tokens,0)):cs.reduce((a,c)=>a+c.kib,0).toFixed(1);const selected=state.route==='main'?main:scout;return shell('Who received the raw results?',rich()?'Compare direct intake at the main agent with a scout that reads first and returns a small, specific digest.':'Compare supplied model values. Hook session IDs alone do not reliably separate the main agent from its scouts.')+(list.length?`<div class="route"><button class="routebox" data-route="main" aria-pressed="${state.route==='main'}"><span>${rich()?'Main agent':'Main model group'}</span><small>Main model · synthetic model label</small><span class="amount">${total(main)}</span><span>${unit()} · ${main.length} returns</span>${hasResponse()?'<div class="routebar"><i style="width:100%"></i></div>':''}<small>${rich()&&hasResponse()?'Includes the 420-token scout report':'Agent identity and final delivery unknown'}</small></button><div class="connector">${rich()&&hasResponse()?'420 tokens<span class="arrow">←</span>digest to main':'Link unknown<span class="arrow">···</span>no attribution'}</div><button class="routebox scout" data-route="scout" aria-pressed="${state.route==='scout'}"><span>${rich()?'Scout':'Budget model group'}</span><small>Budget model · synthetic model label</small><span class="amount">${total(scout)}</span><span>${unit()} · ${scout.length} returns</span>${hasResponse()?`<div class="routebar"><i style="width:${scout.reduce((a,c)=>a+(rich()?c.tokens:c.kib),0)/main.reduce((a,c)=>a+(rich()?c.tokens:c.kib),0)*100}%"></i></div>`:''}<small>${rich()?'Raw results stay with the scout in this example':'Lower price is an assumption, not measured cost'}</small></button></div><div class="routing-bottom"><section aria-label="Selected model returns">${selected.map(c=>`<div class="compact-row"><span><code>${esc(c.cmd)}</code></span><span>${value(c)}</span></div>`).join('')}<p>${rich()&&hasResponse()&&scenario()!=='evicted'?'The main agent received three large returns before the scout started. Try delegating bounded discovery earlier.':'Two model values are visible. Different models do not prove a parent/scout relationship or that a cheaper model was used.'}</p><small>${rich()?'Earlier delegation is a proposal. Quality, inherited context and scout overhead still need comparison.':'Require explicit actor and report-delivery IDs before drawing an agent route.'}</small></section><section class="calculator" aria-label="Hypothetical main intake calculator">${rich()&&hasResponse()?`<label for="digest">Try a different digest size <output id="digest-label">420</output> tokens</label><input id="digest" type="range" min="100" max="4400" step="20" value="420"><div><span id="avoided" class="calc-value">3,980</span> fewer tokens at main</div><p class="muted">Compared with sending these same 4,400 raw tokens directly to main. This is a what-if calculation, not net cost savings.</p><small>Scout input, output, inherited context, latency and repeated requests are excluded.</small>`:'<p>Context comparison unavailable.</p><p class="muted">Use proposed delivery metadata to explore the hypothetical scout calculator. Observed response bytes cannot establish what reached the parent.</p>'}</section></div><p class="foot">No dollar estimate is shown. Model pricing, request usage, cache effects and attribution assumptions are required before making a cost claim.</p>`:empty())}
const proposals=[{title:'Narrow discovery first',call:1,statement:'Start inside the task area before searching the repository.',hypothesis:'Try filename discovery and a scoped symbol search before requesting full search results.',before:'rg -n "timeout" .',after:'rg --files src/inventory\nrg -n "timeout" src/inventory',test:'Compare observed output and time to the first relevant function. Verify the same retry behavior and failure cases. Widen the search if the scoped attempt misses them.'},{title:'Read around the symbol',call:2,statement:'Locate the function before reading every file.',hypothesis:'Use the matched symbol to choose a bounded range, then expand when dependencies require it.',before:'cat src/inventory/*.ts',after:'rg -n "fetchInventory|retry" src/inventory\nsed -n \'110,165p\' src/inventory/client.ts',test:'Check whether the bounded read still reveals retry policy and error propagation. Compare output volume and follow-up reads, not just the first return.'},{title:'Delegate discovery earlier',call:3,statement:'Let a budget scout inspect the code before main reads the large returns.',hypothesis:'Give the scout one question and ask for files, line references, a short answer and unresolved questions.',before:'Main searches and reads raw results.\nScout starts after three large returns.',after:'Scout: locate inventory retry behavior.\nReturn cited ranges and open questions.\nMain: inspect the cited implementation.',test:'Compare total input and output across both agents, scout startup and inherited context, elapsed time and task correctness. A smaller main digest alone is not a cost win.'}];
function review(){const p=proposals[state.proposal],c=calls.find(c=>c.id===p.call),kept=state.decisions.filter(d=>d==='kept').length;return shell('Choose one workflow change to test','Review the evidence, keep a proposal or dismiss it. A candidate is a question about your workflow, not an automatic instruction change.')+(available().length?`<div class="review-layout"><aside class="review-queue" aria-label="Proposal queue">${proposals.map((p,i)=>`<button class="proposal" data-proposal="${i}" aria-pressed="${state.proposal===i}">${p.title}<small>${state.decisions[i]} · ${i===2?'needs actor attribution':'command-based rule'}</small></button>`).join('')}</aside><section class="review-sheet"><p class="statement">${p.statement}</p><p>${p.hypothesis}</p><div class="status">${scenario()==='evicted'&&p.call===1?'Source call was evicted. This proposal can no longer be verified against retained evidence.':p.call===3&&!rich()?'Agent routing is unverified in hook evidence mode. Keep only as a human-authored experiment.':`Call ${String(c.id).padStart(2,'0')} · ${value(c)} ${unit()} · ${esc(c.flag)}`} ${scenario()==='gap'?'Coverage is incomplete; this may not be the first discovery attempt.':''}</div><div class="comparison"><div><small>Observed command or proposed route</small><pre>${esc(p.before)}</pre></div><div><small>Try on a future attempt</small><pre>${esc(p.after)}</pre></div></div><p>${p.test}</p><div class="actions"><button class="primary" id="keep" ${scenario()==='evicted'&&p.call===1?'disabled':''}>${state.decisions[state.proposal]==='kept'?'Kept for experiment':'Keep for experiment'}</button><button id="dismiss">Dismiss</button><button id="undo" ${state.decisions[state.proposal]==='unreviewed'?'disabled':''}>Undo decision</button><button data-ledger="${p.call}" ${scenario()==='evicted'&&p.call===1?'disabled':''}>Inspect evidence</button></div><div class="review-summary"><span>${kept} of 3 proposals kept</span><button id="export" ${kept?'':'disabled'}>Download experiment .md</button></div><p class="foot">Decisions stay in this page until reload. Download includes assumptions and synthetic evidence labels. No commands, settings or agent instructions are changed.</p></section></div>`:empty())}
function guidance(){return `<div class="guidance"><h1>Build guidance</h1><p>The selected implementation uses explicit, bounded local Codex analysis with an editable model choice. It combines these four views around one session, analysis run and focused call. Changing views does not invoke the model. Agent routing uses supplied model groups while delivery links remain unknown. These standalone concepts use synthetic data.</p><div class="toolbar"><button id="download-notes" class="primary">Download full guidance .md</button><button id="return">Return to concepts</button></div><p class="notice">The current app records hook input, not a complete account of the model's context. The 60 KiB whole-hook limit can drop the largest returns.</p><details open><summary>Compare the four concepts</summary><table><thead><tr><th>Concept</th><th>Best question</th><th>Build condition</th></tr></thead><tbody><tr><td>Result ledger</td><td>Which return should I inspect first?</td><td>Accepted tool arguments and supported response fields</td></tr><tr><td>Search trail</td><td>Why did discovery stay broad?</td><td>Bounded ordered history and explicit call IDs</td></tr><tr><td>Agent routing</td><td>Did main receive raw data or a digest?</td><td>Verified agent and delivery links</td></tr><tr><td>Workflow review</td><td>What should I try differently?</td><td>Traceable rules, human review and a quality check</td></tr></tbody></table></details><details open><summary>Available now and proposed capture changes</summary><p>The hook reference documents model, tool input, response and call identifiers. Accepted original JSON already preserves these fields. Extract and index them in the existing worker. Real-client support still needs verification.</p><p>Agent identity on every call, final context delivery, truncation details and request usage need explicit metadata. A tool result inside code mode may be filtered before the model sees it. Do not add the whole nested result to a context total.</p><p>Prefer a bounded metadata event emitted by Codex for oversized returns. Keep complete accepted payloads intact. Do not read transcripts, wrap other hooks or collect environment variables.</p><p><a href="https://learn.chatgpt.com/docs/hooks" target="_blank" rel="noreferrer">Official Codex hook reference ↗</a></p></details><details><summary>Metric definitions and uncertainty</summary><p>27,300 demo delivered tokens = 22,900 at main + 4,400 at scout. The 420-token digest is counted once at its receiver. All token values are invented. Hook mode uses 103.9 KiB of synthetic observed response values, not hook payload bytes.</p><p>The routing calculator compares 4,400 raw tokens with a hypothetical digest. It excludes scout overhead and is not a dollar estimate. Gaps and eviction restrict every total to retained evidence.</p><p>A repeated command can be justified. A wide search can be necessary. No view claims to know what the model used or what an untried workflow would save.</p></details><details><summary>Implementation and acceptance</summary><p>Use bounded worker extraction, SQLite indexes, paged results and one selected payload. Cancel stale work, cap pending call pairs, expire unmatched calls and evict derived evidence with source history. Analysis must yield under pressure while capture remains independent.</p><p>Validate direct shell, long-running polling, code-mode filtering, MCP, scouts, model changes, compaction and capture gaps against the supported client. Missing fields stay unknown. Preserve the selected call and payload position during arrivals.</p><p>The HTML is a synthetic prototype. Production Electron integration, resource budgets and macOS behavior require separate validation. The downloaded guidance contains build slices, field requirements, rules, metric definitions and acceptance criteria.</p></details></div>`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===state.view)));if(scenario()==='evicted'&&state.selected===1)state.selected=2;$('#main').innerHTML=({ledger,trail,routing,review,guide:guidance}[state.view])();wire()}
function go(v){clearTimeout(toastTimer);$('#toast').textContent='';state.view=v;render()}
function wire(){document.querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>{state.selected=+b.dataset.call;render()});document.querySelectorAll('[data-trace]').forEach(b=>b.onclick=()=>{state.selected=+b.dataset.trace;go('trail')});document.querySelectorAll('[data-ledger]').forEach(b=>b.onclick=()=>{state.selected=+b.dataset.ledger;state.query='';state.candidates=false;go('ledger')});document.querySelectorAll('[data-proposal]').forEach(b=>b.onclick=()=>{state.proposal=+b.dataset.proposal;go('review')});document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{state.route=b.dataset.route;render()});document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{$('#scenario').value='sample';render()});if($('#search'))$('#search').oninput=e=>{const pos=e.target.selectionStart;state.query=e.target.value;render();$('#search').focus();try{$('#search').setSelectionRange(pos,pos)}catch{}};if($('#sort')){$('#sort').disabled=!hasResponse();$('#sort').onchange=e=>{state.sort=e.target.value;render()}}if($('#candidates'))$('#candidates').onchange=e=>{state.candidates=e.target.checked;render()};if($('#reset-search'))$('#reset-search').onclick=()=>{state.query='';state.candidates=false;render()};if($('#digest'))$('#digest').oninput=e=>{$('#digest-label').textContent=fmt(+e.target.value);$('#avoided').textContent=fmt(4400-e.target.value)};if($('#keep'))$('#keep').onclick=()=>{state.decisions[state.proposal]='kept';render();tell('Proposal kept. Download the experiment to retain it.')};if($('#dismiss'))$('#dismiss').onclick=()=>{state.decisions[state.proposal]='dismissed';render();tell('Proposal dismissed. Undo is available.')};if($('#undo'))$('#undo').onclick=()=>{state.decisions[state.proposal]='unreviewed';render()};if($('#export'))$('#export').onclick=()=>download('session-analyzer-experiment.md','# Workflow experiment\n\nSynthetic session demo-a7. These proposals are untested. No measured cost savings.\nCapture mode: '+$('#capture').selectedOptions[0].text+'\nScenario: '+$('#scenario').selectedOptions[0].text+'\nCoverage outside retained sample is unknown.\n\n'+proposals.filter((p,i)=>state.decisions[i]==='kept').map(p=>'## '+p.title+'\n\n'+p.hypothesis+'\n\nProposed attempt:\n\n```text\n'+p.after+'\n```\n\nValidation: '+p.test+'\n\nSource: synthetic call '+p.call+'. Recheck that the original evidence is still retained.').join('\n\n'));if($('#download-notes'))$('#download-notes').onclick=()=>download('session-analyzer-notes.md',buildNotes);if($('#return'))$('#return').onclick=()=>go('ledger')}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));$('#capture').onchange=()=>{clearTimeout(toastTimer);$('#toast').textContent='';render()};$('#scenario').onchange=()=>{clearTimeout(toastTimer);$('#toast').textContent='';state.selected=scenario()==='evicted'?2:1;render()};$('#guide').onclick=()=>go('guide');
const buildNotes="# Session analyzer concepts\n\nFour conceptual views for one session, shown as separate entry points in this synthetic design reference. The implemented workspace combines them behind shared session, run and call selection; see [Session analysis](../session-analysis.md) for current behavior and limits. All four use the same eight-call inventory-retry example. The HTML includes this guidance and a download button.\n\n| Concept | User task | Main interaction | Tradeoff |\n| --- | --- | --- | --- |\n| 1. Result ledger | Find the largest returns worth investigating | Rank calls, filter candidates, inspect one call and its proposed narrower query | Fast triage, but output size alone cannot establish waste |\n| 2. Search trail | Understand how broad discovery led to repeated reading | Select an ordered call, inspect its scope and preceding evidence | Preserves sequence; a shared path is a clue, not proof of causation |\n| 3. Agent routing | See which model received raw results and whether a scout reduced the parent's intake | Select a route, compare raw input with the returned digest, adjust a hypothetical digest size | Strong fit for delegation decisions; requires verified actor and delivery links |\n| 4. Workflow review | Turn a suspicious call into one testable workflow change | Review evidence, keep or dismiss a proposal, download the selected experiment | Actionable, but suggestions need human judgment and quality validation |\n\nThe selected implementation uses explicit, bounded local Codex analysis with an editable model choice and human review. Changing views does not invoke the model. Agent routing falls back to supplied model groups while actor attribution remains unknown. The standalone concepts below retain their synthetic detection rules and proposed delivery metadata for comparison.\n\n## Interaction contract\n\nChoose a numbered concept in the top navigation. Capture detail switches between hook evidence and proposed delivery metadata. Scenario controls cover retained samples, an unknown coverage gap, missing tool responses, empty history, and an evicted selection. These are mockup controls, not production configuration. The session task and identifier stay fixed. Each concept has its own composition rather than the same dashboard with renamed panels. Use one title and necessary control labels, with no extra UX subheadings.\n\nThe ledger supports literal command search, candidate filtering, output-size or time order, and a selected-call inspector. Search trail uses observation order, never implied reasoning or replay. Agent routing distinguishes output observed by a hook from data delivered to an agent. The calculator changes an assumption only. Workflow review stores decisions in page memory and exports a Markdown experiment; it does not change instructions, execute commands, or spawn agents. Reload restores the synthetic example.\n\n## What the hooks can establish\n\nThe official [Codex hook reference](https://learn.chatgpt.com/docs/hooks) documents model, session, turn and tool-call identifiers, tool arguments and responses. It documents subagent lifecycle IDs, but subagent hooks share the parent session ID. Hosted tools and some special paths have coverage exceptions. Code-mode nested tool results need not equal what the model receives. Verify fields and call paths against the actual supported client before making compatibility claims.\n\nThe current protocol preserves all accepted original JSON, including unknown fields. The collector indexes only hook, session and tool names. The viewer can derive additional fields from accepted payloads without changing the version 1 envelope. Current fixtures are synthetic and do not establish real-session support. See `protocol/README.md`, `linux/src/contract.rs`, `electron/src/database.ts`, and `docs/architecture.md`.\n\n| Diagnostic | First implementation | Information still needed |\n| --- | --- | --- |\n| Broad searches and missing prefiltering | Inspect supplied command or structured arguments. Detect literal root searches, full-file reads and supported output-limit fields | Tool-specific parsing. Dynamic shell expressions remain unclassified. Broad searches may be justified |\n| Large returns | Compute bytes of a supported textual response field and separately retain original hook byte count | Response availability and format validation. JSON serialization size is not textual output size |\n| Active model | Extract supplied model per event | Missing values stay unknown. Do not infer from role or current configuration |\n| Repeated retrieval | Flag repeated normalized arguments in a bounded retained interval | A repeated query may see changed files. Similar arguments do not establish identical output or wasted work |\n| Main agent versus scout | Show model groups today. Use explicit lifecycle and invocation IDs only where verified | Stable originating agent ID and parent ID on each tool event; delivery correlation for the scout report |\n| Actual context intake | Display hook response bytes as observed tool output | Codex-side metadata after formatting, truncation, code-mode filtering and hook transformations, with final delivery ID and recipient |\n| Tokens and dollars | Keep unavailable values explicit | Tokenizer identity and version for estimates; request-level usage, cached tokens, active model, pricing basis and request attribution for costs |\n| Useful versus wasted output | Human-reviewed candidates and an explanation of the rule | Task correctness and a controlled comparison. Hooks cannot tell what information the model used |\n\n## Capture changes to consider\n\n1. First, add bounded worker-side extraction and SQLite indexes for optional model, turn ID, tool-use ID, supported arguments, observed response bytes, and extraction status. Preserve original payload text. Missing fields are null, never zero. A tool's absence is not proof it was not used.\n2. Run a real-client compatibility experiment covering direct shell, long-running exec with polling, code-mode nested calls and selective printing, MCP, a subagent, a model change, compaction and capture disconnection. Check actual delivered results against observed hooks without adding transcript collection to the application.\n3. If hooks cannot identify the executing agent or final delivery, propose upstream Codex instrumentation that emits those facts in supplied hook input. Include originating agent ID, parent ID, delivery ID, nested-call relationship, final delivered text byte count and truncation state. These are proposed fields, not existing hook fields. Do not wrap tools, rewrite results, inject advice, or read transcripts or environment variables.\n4. Current input is limited to 61,440 bytes for the whole hook JSON. Oversized events are dropped whole and global collector drop counts cannot identify the session or original size. This biases a ranking toward smaller accepted results. Prefer a separate, bounded metadata-only event emitted by Codex for a large result, carrying original length and omission reason, without pretending a partial payload is complete. This needs explicit event allowlisting and protocol coordination. Never have the observer read an unbounded response just to count it. Raising the cap requires measurements across both applications and the transport.\n5. Request usage metadata would enable a cost model, but cannot establish exact per-call marginal cost without attribution assumptions. Prompt reuse, caching, compaction, output tokens and scout setup all matter. A lower raw-result count at the main model is only one component of savings.\n\n## Metric definitions\n\nThe example contains 27,300 hypothetical delivered tokens across eight deliveries. Main receives 22,900 and scout receives 4,400. The first three returns contribute 21,900. All token values are invented to demonstrate a future delivery metric; they are not a bytes-to-tokens conversion or current pricing. Hook mode instead shows synthetic observed response sizes: 44.8, 25.5, 13.0, 1.1, 12.2, 4.6, 1.6 and 1.1 KiB, totaling 103.9 KiB. Each is below the whole-hook admission cap with room for its metadata. These are fixture annotations, not measurements of embedded excerpts.\n\nThe scout receives 4,400 tokens and returns a 420-token digest to the main agent. Those are different deliveries. Count the digest once at its receiving agent, never again as a tool result plus a lifecycle message. The sample diagram uses verified links only in proposed mode. Hook mode groups by the supplied synthetic model value and does not infer an agent from it.\n\nThe calculator compares sending 4,400 raw tokens to the main agent with sending a hypothetical digest of S tokens. Main intake avoided is 4,400 minus S. It excludes the scout's input, prompt, output, inherited context, latency and later requests. It is not net cost savings. Model names Main model and Budget model are synthetic labels, not product or pricing claims.\n\nA gap, missing response or eviction invalidates full-session conclusions. Show retained coverage and unknown amounts beside totals. Known collector drops remain global, separate from the session. The mockup gap count of two is a synthetic global collector count; session loss remains unknown. Never relabel retained totals as complete session totals. Do not infer retained context size from cumulative deliveries or subtract a guessed amount at compaction.\n\n## Detection and data design\n\nUse per-event evidence with a rule ID and version, source event reference, availability state and a bounded explanation. Candidate means review needed, not waste proven. Begin with narrowly supported command patterns. A literal repository-root rg search can suggest filename discovery or a known directory. cat over multiple files can suggest bounded ranges. Limit flags alone do not prove prefiltering. Avoid automatic shell rewriting; display an authored proposal for review.\n\nPair pre/post events using session, turn and tool-use IDs plus actor ID when supplied. Do not pair by arrival time. Pending pairs must expire and have a fixed capacity. Keep unpaired post events useful, mark unmatched pre events as response unavailable, and preserve ambiguity. Tool polling, nested calls and parent reports need deduplication keyed to explicit origin and delivery IDs, not content similarity.\n\nUse existing worker/database ownership. Page ranked calls with indexed queries; keep a bounded selected payload and small visible neighborhood in the renderer. Bound extraction, joins, summaries, candidate storage, query duration, copy size and exports. Evict derived rows with source history. Cancel obsolete queries and ignore stale generations. Calculate top results incrementally within a bounded worker budget. Pause analysis under pressure and show Analysis incomplete while capture retains its independent best-effort behavior. The standalone mockup needs no runtime process or model API. The selected implementation adds one bounded, user-requested local Codex CLI analysis process group.\n\nReuse established application budgets. Measure any additional budgets with idle, sustained and burst capture, largest accepted payloads, rapid search and selection, eviction and storage pressure. Report total Electron process memory, CPU, responsiveness and dropped work. Browser prototype inspection does not establish production Electron integration or macOS behavior.\n\n## Build slices and acceptance\n\n- Begin with a read-only ledger for the selected session, indexed optional fields, observed response bytes and explicit unknown states. Selecting a candidate opens its exact retained hook input and the rule explanation. Unsupported formats do not receive invented counts.\n- Add the ordered search trail using the same selected call. Present suggested relationships separately from verified identifiers. New arrivals never move a frozen selection or its payload scroll position.\n- Add actor routing only after the compatibility experiment establishes reliable attribution. Fall back to model groups when it does not. No absent-scout accusations across coverage gaps.\n- Add human-reviewed experiment export after diagnostics are trustworthy. Keep, dismiss and undo must be visible and reversible. Export only reviewed bounded evidence after an explicit user action; never publish real captures automatically.\n- Validate a selected session cannot mix another session's data; missing response and model differ from zero; gap and eviction states preserve truthful totals; cancellation prevents stale results; identical polling and lifecycle records cannot double-count a delivery; all proposal exports state assumptions.\n- Run and visually inspect the implemented Electron app on Linux with a recorded walkthrough of all concepts retained for implementation, search/no matches, long text, unknown fields, capture gaps, recovery, eviction and pressure. Keep generated evidence under ignored `.artifacts/visual/`, attach it only to the relevant GitHub PR, and state macOS limitations.\n";
render();
</script></body></html>
